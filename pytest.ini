[pytest]
DJANGO_SETTINGS_MODULE = awareness_portal.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-config=.coveragerc
    --no-cov-on-fail
    --maxfail=5
testpaths = .
norecursedirs = .git .venv venv env staticfiles node_modules

[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */staticfiles/*
    */manage.py
    */wsgi.py
    */asgi.py
    */settings*.py
    */urls.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
