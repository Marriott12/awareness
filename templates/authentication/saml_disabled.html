{% extends "base.html" %}

{% block title %}SAML SSO Not Available{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-warning">
                <h4><i class="fas fa-exclamation-triangle"></i> SAML SSO Not Available</h4>
                <p>{{ message }}</p>
                <hr>
                <p class="mb-0">
                    <a href="{% url 'authentication:login' %}" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Use Standard Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
