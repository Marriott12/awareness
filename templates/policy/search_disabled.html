{% extends "base.html" %}

{% block title %}Search Not Available{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-info">
                <h4><i class="fas fa-info-circle"></i> Full-Text Search Not Available</h4>
                <p>{{ message }}</p>
                <p>Elasticsearch must be configured to enable advanced search capabilities.</p>
                <hr>
                <p class="mb-0">
                    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Return to Dashboard
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
